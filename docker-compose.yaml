version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itup_frontend
    ports:
      - "3001:3000"
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # If the app needs more memory during build or run, configure it here.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
